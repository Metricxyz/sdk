name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  v0:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v0/package-lock.json

      - name: Verify v0
        run: npm run verify
        env:
          MAINNET_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}

  v1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v1/package-lock.json

      - name: Check v1 contract pins match versions.env
        run: npm run sync:versions:env:check

      - name: Verify v1
        run: npm run verify
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}

  metric-omm-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metric-omm-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: metric-omm-sdk/package-lock.json

      - name: Verify wrapper
        run: npm run verify
