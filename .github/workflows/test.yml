name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Read periphery pin
        id: pin
        run: echo "ref=$(node -p "require('./package.json').metricPeripheryRef")" >> "$GITHUB_OUTPUT"

      - name: Configure git for private Metric-OMM repos
        env:
          SUBMODULE_PAT: ${{ secrets.PRIVATE_SUBMODULES_PAT }}
        run: |
          if [ -z "${SUBMODULE_PAT}" ]; then
            echo "Set repository secret PRIVATE_SUBMODULES_PAT with read access to Metric-OMM/metric-core and Metric-OMM/metric-periphery." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/Metric-OMM/".insteadOf "https://github.com/Metric-OMM/"

      - name: Clone metric-periphery
        # Cloned outside the workspace: the repo root is now the Hardhat project
        # itself, so a checkout here would sit inside the project tree.
        run: |
          git clone https://github.com/Metric-OMM/metric-periphery.git "${RUNNER_TEMP}/metric-periphery"
          git -C "${RUNNER_TEMP}/metric-periphery" fetch --depth 1 origin ${{ steps.pin.outputs.ref }}
          git -C "${RUNNER_TEMP}/metric-periphery" checkout --force ${{ steps.pin.outputs.ref }}
          git -C "${RUNNER_TEMP}/metric-periphery" submodule sync --recursive
          git -C "${RUNNER_TEMP}/metric-periphery" submodule update --init --force --depth 1 --recursive

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Link cloned periphery
        run: |
          mkdir -p node_modules/@metric
          rm -rf node_modules/@metric/periphery
          ln -s "${RUNNER_TEMP}/metric-periphery" node_modules/@metric/periphery

      - name: Verify
        run: npm run verify
